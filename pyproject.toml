[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ads-black-hole-raytracer"
version = "0.2.0"
description = "Generic 3+1-dimensional asymptotically AdS null-geodesic ray tracer"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "scipy>=1.12",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
adsrt = "adsrt.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["adsrt*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
